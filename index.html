  function refill() {
    let items = shuffle(pool());
    if (items.length > 1 && items[items.length - 1].id === lastId) {
      const t = items[0]; items[0] = items[items.length - 1]; items[items.length - 1] = t;
    }
    deck = items;
  }
  function updateFoot() {
    const all = bank().length;
    const mid = bank().filter(q => q.mid).length;
    const extra = all - mid;
    const counts = {};
    bank().forEach(q => { counts[q.source] = (counts[q.source] || 0) + 1; });
    foot.textContent = "Default Start is the midterm pool (" + mid + "). Beyond midterm: " + extra
      + " (Lecture 5 CNS / psychiatric, including the SSRI and opioid tutorial items). Full bank " + all
      + ". Sources: past paper " + (counts["past paper"] || 0)
      + " · tutorial " + (counts["tutorial"] || 0)
      + " · revision exercise " + (counts["revision"] || 0)
      + " · rewritten " + (counts["rewritten"] || 0)
      + ". Midterm is Lectures 1–4 through respiratory drugs, non-CNS tutorials, and Revision Exercise 1. Stems are paraphrased. Each explanation is English, then Traditional Chinese. This is not an official paper.";
  }
  function drawNext() {
    if (!deck.length) refill();
    let q = deck.pop();
    if (q && q.id === lastId && deck.length) {
      const other = deck.pop();
      deck.push(q);
      q = other;
    }
    lastId = q.id;
    locked = false;
    renderQuestion(q);
  }
  function renderIdle() {
    stage.innerHTML = "";
    const box = document.createElement("div");
    box.className = "idle";
    const p = document.createElement("p");
    p.textContent = "Start uses the midterm set: Lectures 1–4 through respiratory drugs, plus Revision Exercise 1. Change the practice set if you want CNS / psychiatric items only.";
    const btn = document.createElement("button");
    btn.className = "start";
    btn.type = "button";
    btn.textContent = "Start";
    btn.addEventListener("click", drawNext);
    box.appendChild(p);
    box.appendChild(btn);
    stage.appendChild(box);
  }
  function renderQuestion(q) {
    stage.innerHTML = "";
    const stem = document.createElement("h2");
    stem.className = "stem";
    stem.textContent = q.stem;
    const opts = document.createElement("div");
    opts.className = "opts";
    const buttons = q.options.map((text, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      const lab = document.createElement("span");
      lab.className = "letter";
      lab.textContent = letters[i];
      b.appendChild(lab);
      b.appendChild(document.createTextNode(text));
      b.addEventListener("click", () => choose(q, i, buttons));
      opts.appendChild(b);
      return b;
    });
    stage.appendChild(stem);
    stage.appendChild(opts);
  }
  function choose(q, i, buttons) {
    if (locked) return;
    locked = true;
    answered += 1;
    const ok = i === q.answer;
    if (ok) correct += 1;
    answeredEl.textContent = String(answered);
    correctEl.textContent = String(correct);
    buttons.forEach((b, idx) => {
      b.disabled = true;
      if (idx === q.answer) b.classList.add("good");
      else if (idx === i) b.classList.add("bad");
    });
    const fb = document.createElement("div");
    fb.className = "feedback " + (ok ? "ok" : "no");
    const v = document.createElement("p");
    v.className = "verdict";
    v.textContent = ok ? "Correct" : ("Incorrect. The correct answer is " + letters[q.answer]);
    const ex = document.createElement("p");
    ex.className = "explain";
    ex.textContent = q.explain;
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.textContent = "Source: " + q.source;
    fb.appendChild(v); fb.appendChild(ex); fb.appendChild(tag);
    const row = document.createElement("div");
    row.className = "nextrow";
    const next = document.createElement("button");
    next.className = "start";
    next.type = "button";
    next.textContent = "Next question";
    next.addEventListener("click", drawNext);
    row.appendChild(next);
    stage.appendChild(fb);
    stage.appendChild(row);
  }
  scopeEl.addEventListener("change", () => { deck = []; });
  subjectEl.addEventListener("change", () => {
    deck = [];
    lastId = null;
    answered = 0;
    correct = 0;
    answeredEl.textContent = "0";
    correctEl.textContent = "0";
    updateFoot();
    renderIdle();
  });
  updateFoot();
  renderIdle();
})();
</script>
</body>
</html>
