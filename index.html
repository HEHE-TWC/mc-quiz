          calcFmt(minVol / 2, "mL"),
          calcFmt(minVol * 2, "mL"),
          calcFmt(dose / 5 + 50, "mL"),
          calcFmt(Math.max(1, minVol - 50), "mL"),
          Math.round(minMin) + " mL"
        ];
        stem = "Vancomycin " + dose + " mg IV is ordered. Using a maximum concentration of 5 mg/mL, what is the minimum infusion volume?";
        explain =
          "Maximum concentration 5 mg/mL → minimum volume = dose ÷ 5 = " + dose +
          " ÷ 5 = " + calcFmt(minVol) + " mL. (Also rate should not exceed 10 mg/min.)\n最高濃度 5 mg/mL → 最少體積＝劑量÷5＝" +
          dose + "÷5＝" + calcFmt(minVol) + " mL。（速率亦唔好超過 10 mg/min。）";
      } else {
        correctLabel = Math.round(minMin) + " min";
        distractors = [
          Math.round(minVol) + " min",
          Math.round(minMin / 2) + " min",
          Math.round(minMin * 2) + " min",
          Math.round(dose / 20) + " min",
          Math.round(minMin + 15) + " min",
          Math.round(Math.max(1, minMin - 15)) + " min"
        ];
        stem = "Vancomycin " + dose + " mg IV is ordered. Infusion must not exceed 10 mg/min. What is the minimum infusion time?";
        explain =
          "Rate ≤ 10 mg/min → minimum time = dose ÷ 10 = " + dose + " ÷ 10 = " +
          calcFmt(minMin) + " min. (Also keep concentration ≤ 5 mg/mL.)\n速率 ≤10 mg/min → 最短時間＝劑量÷10＝" +
          dose + "÷10＝" + calcFmt(minMin) + " 分鐘。（濃度亦 ≤5 mg/mL。）";
      }
      var built = calcBuildOpts(correctLabel, distractors);
      return { id: "calc-vanco-min", stem: stem, options: built.options, answer: built.answer, explain: explain, source: "tutorial (calculation)", mid: true };
    }
  },
  {
    id: "calc-draw-volume",
    mid: true,
    gen: function () {
      var want = calcPick([125, 250, 500, 750, 1000]);
      var conc = calcPick([50, 100, 125, 250]);
      var raw = want / conc;
      var correct = calcRoundDose(raw);
      var correctLabel = calcFmt(correct, "mL");
      var d1 = calcFmt(calcRoundDose(want / (conc * 2)), "mL");
      var d2 = calcFmt(calcRoundDose(want / (conc / 2)), "mL");
      var d3 = calcFmt(calcRoundDose(correct + (correct >= 2 ? 1 : 0.5)), "mL");
      var d4 = calcFmt(calcRoundDose(Math.max(0.01, correct - (correct >= 2 ? 1 : 0.5))), "mL");
      var d5 = calcFmt(calcRoundDose(want / (conc + 25)), "mL");
      var built = calcBuildOpts(correctLabel, [d1, d2, d3, d4, d5, calcFmt(calcRoundDose(correct * 1.5), "mL")]);
      var stem = "You need to give " + want + " mg of Drug A. The vial concentration is " + conc +
        " mg/mL. How many millilitres should you draw up?";
      var explain =
        "Volume = Want ÷ concentration = " + want + " mg ÷ " + conc + " mg/mL = " +
        calcFmt(correct) + " mL.\n抽取體積＝需要量÷濃度＝" + want + "÷" + conc + "＝" + calcFmt(correct) + " mL。";
      return { id: "calc-draw-volume", stem: stem, options: built.options, answer: built.answer, explain: explain, source: "rewritten (calculation)", mid: true };
    }
  }
];


const BANKS = { NUR2047: QUESTIONS };
</script>
<script>
(function () {
  const stage = document.getElementById("stage");
  const answeredEl = document.getElementById("answered");
  const correctEl = document.getElementById("correct");
  const foot = document.getElementById("foot");
  const scopeEl = document.getElementById("scope");
  const subjectEl = document.getElementById("subject");
  const letters = ["A", "B", "C", "D"];
  let answered = 0, correct = 0;
  let deck = [];
  let lastId = null;
  let locked = false;

  function bank() {
    return BANKS[subjectEl.value] || [];
  }
  function calcSlotsForMode(mode) {
    if (mode === "extra") return [];
    return CALC_TEMPLATES.map(function (t) {
      return { kind: "calc", id: t.id, mid: true, gen: t.gen };
    });
  }
  function pool() {
    const mode = scopeEl.value;
    const items = bank();
    let staticQ;
    if (mode === "extra") staticQ = items.filter(q => !q.mid);
    else if (mode === "all") staticQ = items.slice();
    else staticQ = items.filter(q => q.mid);
    return staticQ.concat(calcSlotsForMode(mode));
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function refill() {
    let items = shuffle(pool());
    if (items.length > 1 && items[items.length - 1].id === lastId) {
      const t = items[0]; items[0] = items[items.length - 1]; items[items.length - 1] = t;
    }
    deck = items;
  }
  function shuffleQuestionOptions(q) {
    // Fresh A–D order every display; answer index follows the correct text.
    const paired = q.options.map(function (text, i) {
      return { text: text, correct: i === q.answer };
    });
    for (let i = paired.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = paired[i]; paired[i] = paired[j]; paired[j] = t;
    }
    q.options = paired.map(function (p) { return p.text; });
    q.answer = paired.findIndex(function (p) { return p.correct; });
    if (q.answer < 0) q.answer = 0;
    return q;
  }
  function materialize(slot) {
    if (slot && slot.kind === "calc" && typeof slot.gen === "function") {
      const q = slot.gen();
      q.id = slot.id;
      q.mid = true;
      return shuffleQuestionOptions(q);
    }
    // Clone so the bank's canonical option order is never mutated.
    const q = Object.assign({}, slot, { options: slot.options.slice() });
    return shuffleQuestionOptions(q);
  }
  function updateFoot() {
    const all = bank().length;
    const mid = bank().filter(q => q.mid).length;
    const extra = all - mid;
    const calcN = CALC_TEMPLATES.length;
    const counts = {};
    bank().forEach(q => { counts[q.source] = (counts[q.source] || 0) + 1; });
    foot.textContent = "Default Start is the midterm pool (" + mid + " static + " + calcN
      + " random-calc templates). Beyond midterm: " + extra
      + " (Lecture 5 CNS / psychiatric, including the SSRI and opioid tutorial items). Full static bank " + all
      + ". Sources: past paper " + (counts["past paper"] || 0)
      + " · tutorial " + (counts["tutorial"] || 0)
      + " · revision exercise " + (counts["revision"] || 0)
      + " · rewritten " + (counts["rewritten"] || 0)
      + ". Each Start/Next regenerates fresh numbers for calculation items and reshuffles A–D option order. Midterm is Lectures 1–4 through respiratory drugs, non-CNS tutorials, and Revision Exercise 1. Stems are paraphrased. Each explanation is English, then Traditional Chinese. This is not an official paper.";
  }
  function drawNext() {
    if (!deck.length) refill();
    let slot = deck.pop();
    if (slot && slot.id === lastId && deck.length) {
      const other = deck.pop();
      deck.push(slot);
      slot = other;
    }
    lastId = slot.id;
    locked = false;
    renderQuestion(materialize(slot));
  }
  function renderIdle() {
    stage.innerHTML = "";
    const box = document.createElement("div");
    box.className = "idle";
    const p = document.createElement("p");
    p.textContent = "Start uses the midterm set: Lectures 1–4 through respiratory drugs, plus Revision Exercise 1, including random-number calculation items that refresh every draw. Change the practice set if you want CNS / psychiatric items only.";
    const btn = document.createElement("button");
    btn.className = "start";
    btn.type = "button";
    btn.textContent = "Start";
    btn.addEventListener("click", drawNext);
    box.appendChild(p);
    box.appendChild(btn);
    stage.appendChild(box);
  }
  function renderQuestion(q) {
    stage.innerHTML = "";
    const stem = document.createElement("h2");
    stem.className = "stem";
    stem.textContent = q.stem;
    const opts = document.createElement("div");
    opts.className = "opts";
    const buttons = q.options.map((text, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      const lab = document.createElement("span");
      lab.className = "letter";
      lab.textContent = letters[i];
      b.appendChild(lab);
      b.appendChild(document.createTextNode(text));
      b.addEventListener("click", () => choose(q, i, buttons));
      opts.appendChild(b);
      return b;
    });
    stage.appendChild(stem);
    stage.appendChild(opts);
  }
  function choose(q, i, buttons) {
    if (locked) return;
    locked = true;
    answered += 1;
    const ok = i === q.answer;
    if (ok) correct += 1;
    answeredEl.textContent = String(answered);
    correctEl.textContent = String(correct);
    buttons.forEach((b, idx) => {
      b.disabled = true;
      if (idx === q.answer) b.classList.add("good");
      else if (idx === i) b.classList.add("bad");
    });
    const fb = document.createElement("div");
    fb.className = "feedback " + (ok ? "ok" : "no");
    const v = document.createElement("p");
    v.className = "verdict";
    v.textContent = ok ? "Correct" : ("Incorrect. The correct answer is " + letters[q.answer]);
    const ex = document.createElement("p");
    ex.className = "explain";
    ex.textContent = q.explain;
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.textContent = "Source: " + q.source;
    fb.appendChild(v); fb.appendChild(ex); fb.appendChild(tag);
    const row = document.createElement("div");
    row.className = "nextrow";
    const next = document.createElement("button");
    next.className = "start";
    next.type = "button";
    next.textContent = "Next question";
    next.addEventListener("click", drawNext);
    row.appendChild(next);
    stage.appendChild(fb);
    stage.appendChild(row);
  }
  scopeEl.addEventListener("change", () => { deck = []; });
  subjectEl.addEventListener("change", () => {
    deck = [];
    lastId = null;
    answered = 0;
    correct = 0;
    answeredEl.textContent = "0";
    correctEl.textContent = "0";
    updateFoot();
    renderIdle();
  });
  updateFoot();
  renderIdle();
})();

</script>
</body>
</html>
